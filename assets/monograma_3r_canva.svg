    <path d="M-6-10 h4 v20 h-4 z M-2-10 h5 c4 0 7 3 7 6.5 c0 3.5-3 6.5-7 6.5 h-5 z M-2-7 h4.5 c2 0 3.5 1 3.5 3.5 c0 2.5-1.5 3.5-3.5 3.5 h-4.5 z M0 3 L 6 10 h4 L 3.5 3 z" 
